<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Baby monitor web: rilevazione movimento e pianto a livelli, video in diretta tra dispositivi tramite Firebase.">
  <title>Baby Monitor</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span class="logo" aria-hidden="true">👶</span><span>Baby Monitor</span></a>
    <div id="topbar-right" class="topbar-right"></div>
  </header>
  <main id="app" class="app" aria-live="polite"></main>
  <div id="toasts" class="toasts" aria-live="assertive"></div>

  <!-- Opzionale: copia firebase-config.example.js in firebase-config.js. In alternativa la
       configurazione si incolla nella schermata iniziale e viene salvata nel browser. -->
  <script src="firebase-config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
